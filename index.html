<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>日本紀地圖</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
    }
  </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet-imageoverlay-rotated@0.2.1/Leaflet.ImageOverlay.Rotated.js"></script>

<script>
  const map = L.map('map').setView(
    [35.00281944444444, 135.7426180555556],
    13
  );

  // OpenStreetMap 底圖
  L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }
  ).addTo(map);


  // ==========================================
  // 平安城內外繪圖
  // 原始 KMZ：
  // north = 35.05238888888888
  // south = 34.95325
  // east  = 135.7930694444445
  // west  = 135.6921666666667
  // rotation = 0.3833°
  // ==========================================

  const north = 35.05238888888888;
  const south = 34.95325;
  const east  = 135.7930694444445;
  const west  = 135.6921666666667;

  const rotation = 0.3833 * Math.PI / 180;

  const centerLat = (north + south) / 2;
  const centerLng = (east + west) / 2;

  // 在當地緯度下，修正經緯度東西、南北尺度不同
  const cosLat = Math.cos(centerLat * Math.PI / 180);

  function rotatePoint(lat, lng) {

    const x = (lng - centerLng) * cosLat;
    const y = lat - centerLat;

    const xr =
      x * Math.cos(rotation) -
      y * Math.sin(rotation);

    const yr =
      x * Math.sin(rotation) +
      y * Math.cos(rotation);

    return L.latLng(
      centerLat + yr,
      centerLng + xr / cosLat
    );
  }

  // 原圖三個角
  const topLeft =
    rotatePoint(north, west);

  const topRight =
    rotatePoint(north, east);

  const bottomLeft =
    rotatePoint(south, west);

  // 建立可旋轉的圖片疊圖
  const heianMap = L.imageOverlay.rotated(
    'heian-city.png',
    topLeft,
    topRight,
    bottomLeft,
    {
      opacity: 0.74,
      interactive: false
    }
  ).addTo(map);

  // 顯示整個疊圖所在地區
  map.fitBounds([
    [south, west],
    [north, east]
  ]);

</script>

</body>
</html>

const heianMap = L.imageOverlay.rotated(
  'heian-city.png',
  topLeft,
  topRight,
  bottomLeft,
  {
    opacity: 0.74,
    interactive: false
  }
).addTo(map);

// 測試地標：平安宮
const marker = L.marker([35.0155, 135.7460]).addTo(map);

marker.bindPopup(`
  <b>平安宮</b><br>
  日本紀中的重要宮城建築。<br>
  之後可以在這裡加入更完整說明。
`);
